# Builds our image on a GitHub runner and pushes it to the GitHub container registry (ghcr.io).
#
# It only runs when you start it by hand (Actions -> Build image -> Run workflow), so nothing is
# built, and no Actions minutes are used, unless you ask for it. Normally you build on your own
# machine with tools/image/build.sh --push, which is faster because it keeps its build cache.
#
# It needs NO secrets of your own: the built-in GITHUB_TOKEN may push to the packages of this
# repository. One-time setup in the repository settings:
#   Settings -> Actions -> General -> Workflow permissions: "Read and write permissions"
# The package is private after the first push. To pull it on a server, `docker login ghcr.io`
# there with a personal access token that has the `read:packages` scope.
name: Build image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, for example 0.37.2-custom.2"
        required: true
      profile:
        description: "release (for rollouts) or fast (a quicker test image)"
        default: release

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the tag you typed, and the short commit (never changes, use it on servers)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fork
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.tag }}
            PROFILE=${{ inputs.profile }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
